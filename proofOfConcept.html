<!DOCTYPE html> 
<html lang="en">
<head> 

    <title>Quest Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="proofOfConcept.css">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
</head> 

<body>
<main>
<h1>Welcome to Quest Manager</h1>

<div class="container-fluid">
<div class="row">
<div class="col-lg-6">

<h2>My Tasks</h2>
<p>Task Points: <span id="counter"></span></p>

<div class="inputWrapper">
<input type="text" id="taskInput" placeholder="Add new...">
<button id="addButton" onclick="addTask()">+</button>
</div>


<ul id="taskList"></ul>

<script>
    var counter = document.getElementById("counter");
    var completedCount = 0;
    var input = document.getElementById("taskInput");
    var list = document.getElementById("taskList");

    input.addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            document.getElementById("addButton").click(); // Trigger the button click

        }
    });

    function addTask() {
        

        if (input.value.trim() === "") { //so that it doesnt empty
            return;
        }

        // Create a new list item
        var li = document.createElement("li");
        var checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        var text = document.createElement("span");
        text.textContent = " " + input.value;

        checkbox.onclick = function() { //crossing out

            if (checkbox.checked) {
                text.classList.add("completed");
            } else {
                text.classList.remove("completed");
            }
            completedCount = list.querySelectorAll(`input[type="checkbox"]:checked`).length;
            counter.textContent = completedCount;
        };
        
        li.appendChild(checkbox);
        li.appendChild(text);

        list.appendChild(li);
        input.value = ""; //clears input
    }
</script>

</div> <!-- end of col-lg-6 div -->


<div class="col-lg-6">
    <h2>My Character</h2>
<figure>
    <img id="image" src="my_character.jpg" class="img-fluid" width="350px" alt="default character">
</figure>
    <button id="buySword" onclick="addSword()">Unlock Sword!(1 Task Point)</button>
    
    <script>
        function addSword() {
            if (completedCount <= 0) {
                alert("You need at least 1 task point to unlock the sword!");
                return;
            }

            completedCount--; // Deduct 1 task point
            counter.textContent = completedCount; // Update the displayed count

            var img = document.getElementById("image");
            img.src = "with_sword.jpg"; // Replace with the path to your new accessory image
            img.className = "img-fluid";

        }
    </script>
</div>

</div> <!-- end of row div -->
</div> <!-- end of container div -->

</main>
</body>
</html>
