<!DOCTYPE html>
<html lang="en">

<head>
    <title>QuestManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style/main.css">
    <link rel="stylesheet" href="style/auth.css">
    <link rel="stylesheet" href="style/home.css">
    <link rel="stylesheet" href="style/journal.css">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>

    <div id="loginView" hidden>
        <form id="login-form">
            <h3 id="auth-title">Welcome back!</h3>
            <p id="auth-subtitle">Enter your credentials to access your account.</p>

            <div id="playerNameGroup" hidden>
                <label class="form-label" for="login-player">Username</label>
                <input class="form-control form-control-sm mb-2" id="login-player" type="text" autocomplete="nickname"
                    maxlength="20">
            </div>

            <label class="form-label" for="login-email">Email</label>
            <input class="form-control form-control-sm mb-2" id="login-email" type="email" autocomplete="username"
                required>

            <label class="form-label" for="login-password">Password</label>
            <input class="form-control form-control-sm mb-2" id="login-password" type="password"
                autocomplete="current-password" minlength="6" required>

            <button class="btn btn-primary btn-sm" id="login-button" type="submit">Log In</button>
            <button class="btn btn-link btn-sm" id="auth-toggle" type="button">
                Create Account
            </button>

            <p id="login-status" role="status" aria-live="polite"></p>
        </form>
    </div>

    <!-- Keep the app hidden until authentication restores a session. -->
    <div id="appView" hidden>
        <h1>Welcome to Quest Manager</h1>

        <nav class="nav nav-pills nav-tabs-custom" id="mainNav">
            <a class="nav-link" href="#home">Home</a>
            <a class="nav-link" href="#journal">Journal</a>
            <a class="nav-link" href="#shop">Shop</a>
        </nav>

        <div class="app page" id="home">
            <aside class="sidebar">

                <div id="accountView" hidden>
                    <p><strong id="account-name"></strong></p>
                    <button class="btn btn-outline-secondary btn-sm" id="signout-button" type="button">
                        Sign Out
                    </button>
                </div>

                <div class="quest-board-header">
                    <h2>Today’s Quest Board</h2>
                    <button id="toggleTaskForm" type="button" aria-label="Add a quest" aria-expanded="false"
                        aria-controls="taskForm">+</button>
                </div>

                <!-- <div>
                    <button id="todoButton" type="button">To-Do</button>
                    <button id="calendarButton" type="button">Calendar</button>
                </div> -->

                <div id="tasksView">
                    <div id="taskForm" hidden>
                        <div class="inputWrapper">
                            <input type="text" id="taskInput" placeholder="Add new...">
                            <select id="difficultySelect" aria-label="Task difficulty">
                                <option value="easy">Easy</option>
                                <option value="medium">Medium</option>
                                <option value="hard">Hard</option>
                            </select>
                            <button id="addButton" type="button">+</button>
                        </div>

                        <label for="taskDescription">Description (optional)</label>
                        <textarea id="taskDescription" rows="3"
                            placeholder="Add details about your quest..."></textarea>
                    </div>

                    <ul id="taskList"></ul>
                </div>
            </aside>

            <main class="main">
                <p class="points-display">
                    Your Points: <span id="counter">0</span>
                </p>
                <figure>
                    <img id="image" src="assets/my_character.jpg" class="img-fluid" width="350px"
                        alt="default character">
                </figure>
                <a class="shop-link" href="#shop">Go to shop!</a>
            </main>
        </div>

        <!-- Journal Section -->
        <section class="page" id="journal" hidden>
            <div class="journal-layout">
                <section class="calendar-view">
                    <header class="calendar-view-header">
                        <h2 class="calendar-view-title">Calendar View</h2>
                        <div class="calendar-view-toggle">
                            <button type="button" class="calendar-view__pill is-active"
                                data-view="monthly">Monthly</button>
                            <button type="button" class="calendar-view__pill" data-view="weekly">Weekly</button>
                            <button type="button" class="calendar-view__pill" data-view="daily">Daily</button>
                        </div>
                    </header>

                    <div class="calendar-view-body">
                        <div id="calendar"></div>
                    </div>
                </section>

                <section class="journal-board">
                    <div class="quest-board">
                        <div class="quest-board-header">
                            <h2 id="dayPanelTitle">Today's Quest Board</h2>
                            <button id="toggleDayForm" type="button" aria-label="Add a quest" aria-expanded="false"
                                aria-controls="dayForm">+</button>
                        </div>

                        <div id="dayForm" hidden>
                            <div class="inputWrapper">
                                <input type="text" id="dayTaskInput" placeholder="Add new...">
                                <button id="dayAddButton" type="button">Add</button>
                            </div>
                        </div>

                        <ul id="dayTaskList"></ul>
                    </div>
                </section>
            </div>
        </section>
        <!-- <div id="dayPanel">
                        <h3 id="dayPanelTitle"></h3>
                        <div class="inputWrapper">
                            <input type="text" id="dayTaskInput" placeholder="Add task for this day...">
                            <button id="dayAddButton" type="button">+</button>
                        </div>
                        <ul id="dayTaskList"></ul>
                    </div> -->
    </div>
    </section>

    <section class="page" id="shop" hidden>
        <h2>Shop</h2>
    </section>

    </div> <!-- End appView -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script type="module" src="./main/shop/shopPage.js"></script>
    <script type="module" src="./main/script.js"></script>

</body>

</html>
