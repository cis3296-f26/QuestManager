<!DOCTYPE html> 
<html lang="en">
<head> 

    <title>QuestManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="proofOfConcept.css">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head> 

<body>
    <h1>Welcome to Quest Manager</h1>
        <div class="app">
            <aside class= "sidebar">
                <h2>My Tasks</h2>
                <p>Task Points: <span id="counter"></span></p>

                <div class="inputWrapper">
                    <input type="text" id="taskInput" placeholder="Add new...">
                    <button id="addButton" onclick="addTask()">+</button>
                </div>
                <ul id="taskList"></ul>
            </aside>

            <main class="main">
                <h2>My Character</h2>
                <figure>
                    <img id="image" src="my_character.jpg" class="img-fluid" width="350px" alt="default character">
                </figure>
                <button id="buySword" onclick="addSword()">Unlock Sword!(1 Task Point)</button>
            </main>
        </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
