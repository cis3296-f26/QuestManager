<text x="30" y="99" font-size="14">Gold = coin · Purple = stompable slime · Wings = deadly bat · Teal tip = triggered rock · Blue = plate / gate</text>
<text x="30" y="122" font-size="14">Light rock = static terrain · ↔ = ferry · Cracks = collapsing slab · Dashed teal box = optional discovery area</text>
