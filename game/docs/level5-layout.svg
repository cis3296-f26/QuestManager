<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020"><rect width="1200" height="1020" fill="#faf0e6"/><text x="28" y="36" font-family="Georgia" font-size="25" fill="#3d5f26">Level 5 · Sunscorched Dunes — authored route plan</text><text x="28" y="61" font-family="Arial" font-size="14" fill="#67533b">Solid tan: terrain · cracked tan: collapsing · gold: coin · orange: scorpion · shaded: wind area (arrows show direction)</text><text x="28" y="95" font-family="Georgia" font-size="19" fill="#3d5f26">1. The Desert Arrival (0–1500)</text><rect x="60" y="109" width="1080" height="125" fill="#c6e3e9"/><rect x="60" y="184.4" width="288" height="60.800000000000004" fill="#bc9165" stroke="#795b39" stroke-width="1"/><rect x="434.4" y="200.4" width="172.79999999999998" height="44.800000000000004" fill="#bc9165" stroke="#795b39" stroke-width="1"/><rect x="607.1999999999999" y="232.4" width="230.39999999999998" height="12.8" fill="#bc9165" stroke="#795b39" stroke-width="1"/><rect x="607.1999999999999" y="189.2" width="273.59999999999997" height="7.68" fill="#bc9165" stroke="#795b39" stroke-width="1"/><rect x="924" y="213.2" width="216" height="32" fill="#bc9165" stroke="#795b39" stroke-width="1"/><circle cx="722.4" cy="222.8" r="10" fill="#efbd43" stroke="#795b29"/><text x="722.4" y="226.8" text-anchor="middle" font-size="12">1</text><path d="M981.5999999999999 207.2h106.56" stroke="#af673f" stroke-width="4"/><text x="1032" y="199.2" font-size="12">scorpion</text><text x="60" y="253" font-family="Arial" font-size="12" fill="#67533b">A safe high cave exit descends to an arch/alcove choice before one clearly visible scorpion.</text><text x="28" y="275" font-family="Georgia" font-size="19" fill="#3d5f26">2. Wind-Cut Canyon (1500–3300)</text><rect x="60" y="289" width="1080" height="125" fill="#c6e3e9"/><rect x="204" y="313.2" width="240" height="64" fill="#bdaf74" opacity=".25"/><text x="212" y="317" font-size="22">→</text><rect x="540" y="313.2" width="264" height="64" fill="#bdaf74" opacity=".25"/><text x="548" y="317" font-size="22">←</text><rect x="60" y="393.2" width="228" height="32" fill="#bc9165" stroke="#795b39" stroke-width="1"/><rect x="384" y="393.2" width="144" height="32" fill="#bc9165" stroke="#795b39" stroke-width="1"/><rect x="630" y="380.4" width="114" height="44.800000000000004" fill="#bc9165" stroke="#795b39" stroke-width="1"/><rect x="834" y="396.4" width="306" height="28.8" fill="#bc9165" stroke="#795b39" stroke-width="1"/><path d="M960 390.4h94.8" stroke="#af673f" stroke-width="4"/><text x="996" y="382.4" font-size="12">scorpion</text><text x="60" y="433" font-family="Arial" font-size="12" fill="#67533b">Introduce a gentle tailwind over a short canyon, then a headwind at a raised pillar, with a broad recovery bank.</text><text x="28" y="455" font-family="Georgia" font-size="19" fill="#3d5f26">3. The Hidden Oasis (3300–4900)</text><rect x="60" y="469" width="1080" height="125" fill="#c6e3e9"/><rect x="60" y="576.4" width="216" height="28.8" fill="#bc9165" stroke="#795b39" stroke-width="1"/><rect x="276" y="592.4" width="330.75" height="12.8" fill="#bc9165" stroke="#795b39" stroke-width="1"/><rect x="687.75" y="573.2" width="168.75" height="32" fill="#bc9165" stroke="#795b39" stroke-width="1"/><rect x="937.5000000000001" y="560.4" width="202.5" height="44.800000000000004" fill="#bc9165" stroke="#795b39" stroke-width="1"/><rect x="181.5" y="546" width="121.50000000000001" height="7.68" fill="#bc9165" stroke="#795b39" stroke-width="1"/><rect x="336.75" y="523.6" width="121.50000000000001" height="7.68" fill="#bc9165" stroke="#795b39" stroke-width="1"/><rect x="485.25" y="523.6" width="128.25" height="7.68" fill="#bc9165" stroke="#795b39" stroke-width="1"/><circle cx="566.25" cy="514" r="10" fill="#efbd43" stroke="#795b29"/><text x="566.25" y="518" text-anchor="middle" font-size="12">2</text><text x="60" y="613" font-family="Arial" font-size="12" fill="#67533b">A wind-free, green recovery hollow with a low main route and an optional sandstone overlook.</text><text x="28" y="635" font-family="Georgia" font-size="19" fill="#3d5f26">4. Scorpion Ridge (4900–6800)</text><rect x="60" y="649" width="1080" height="125" fill="#c6e3e9"/><rect x="253.26315789473685" y="673.2" width="329.6842105263158" height="64" fill="#bdaf74" opacity=".25"/><text x="261.2631578947369" y="677" font-size="22">←</text><rect x="60" y="740.4" width="176.21052631578948" height="44.800000000000004" fill="#bc9165" stroke="#795b39" stroke-width="1"/><rect x="281.6842105263158" y="759.6" width="147.78947368421052" height="25.6" fill="#bc9165" stroke="#795b39" stroke-width="1"/><rect x="514.7368421052631" y="759.6" width="136.42105263157896" height="25.6" fill="#bc9165" stroke="#795b39" stroke-width="1"/><rect x="713.6842105263157" y="759.6" width="136.42105263157896" height="25.6" fill="#bc9165" stroke="#795b39" stroke-width="1"/><rect x="935.3684210526316" y="740.4" width="204.6315789473684" height="44.800000000000004" fill="#bc9165" stroke="#795b39" stroke-width="1"/><rect x="185.05263157894737" y="710" width="68.21052631578948" height="7.68" fill="#bc9165" stroke="#795b39" stroke-width="1"/><rect x="315.7894736842105" y="710" width="56.84210526315789" height="7.68" fill="#c38b58" stroke="#795b39" stroke-width="1" stroke-dasharray="5 3"/><rect x="440.84210526315786" y="710" width="68.21052631578948" height="7.68" fill="#c38b58" stroke="#795b39" stroke-width="1" stroke-dasharray="5 3"/><rect x="588.6315789473684" y="703.6" width="90.94736842105263" height="7.68" fill="#bc9165" stroke="#795b39" stroke-width="1"/><circle cx="645.4736842105264" cy="694" r="10" fill="#efbd43" stroke="#795b29"/><text x="645.4736842105264" y="698" text-anchor="middle" font-size="12">3</text><path d="M332.8421052631579 753.6h50.02105263157895" stroke="#af673f" stroke-width="4"/><text x="349.89473684210526" y="745.6" font-size="12">scorpion</text><path d="M975.1578947368421 734.4h89.81052631578947" stroke="#af673f" stroke-width="4"/><text x="992.2105263157895" y="726.4" font-size="12">scorpion</text><text x="60" y="793" font-family="Arial" font-size="12" fill="#67533b">Separate a lower patrol route from a harder upper wind/collapse route; reconnect on a safe bank before the last scorpion.</text><text x="28" y="815" font-family="Georgia" font-size="19" fill="#3d5f26">5. The Ruins Approach (6800–8200)</text><rect x="60" y="829" width="1080" height="125" fill="#c6e3e9"/><rect x="60" y="920.4" width="216" height="44.800000000000004" fill="#bc9165" stroke="#795b39" stroke-width="1"/><rect x="384" y="904.4" width="185.14285714285714" height="60.800000000000004" fill="#bc9165" stroke="#795b39" stroke-width="1"/><rect x="677.1428571428572" y="891.6" width="169.71428571428572" height="73.60000000000001" fill="#bc9165" stroke="#795b39" stroke-width="1"/><rect x="939.4285714285714" y="904.4" width="200.57142857142858" height="60.800000000000004" fill="#bc9165" stroke="#795b39" stroke-width="1"/><path d="M1109.142857142857 904.4v-35" stroke="#51452b" stroke-width="2"/><path d="M1111.142857142857 869.4l16 6-16 6z" fill="#efbd43"/><text x="60" y="973" font-family="Arial" font-size="12" fill="#67533b">Three familiar, readable terrace jumps lead out of the desert; no new hazard at the flag.</text></svg>